[package]
name = "mcara_compare"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCARA vs CEDAR comparison harness. Rust port of scripts/compare_mcara_cedar.py."

[[bin]]
name = "mcara-compare-cedar"
path = "src/bin/compare_mcara_cedar.rs"

[[bin]]
name = "mcara-compare-all"
path = "src/bin/compare_all.rs"

[lib]
name = "mcara_compare"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
csv = { workspace = true }
clap = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
