[package]
name = "mcara_api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Axum REST + WebSocket API for MCARA, consumed by the Phoenix frontend."

[[bin]]
name = "mcara-api"
path = "src/main.rs"

[dependencies]
mcara_core = { path = "../mcara_core" }
mcara_simulation = { path = "../mcara_simulation" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1"
