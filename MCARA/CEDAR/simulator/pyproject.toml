[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-sim"
version = "2.1.0"
description = "CEDAR-v2.1 reference implementation: stochastic model of centriole-driven stem cell exhaustion (PIDDosome + autophagy modules)"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [{name = "Jaba Tqemaladze", email = "jaba@longevity.ge"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "scipy", "matplotlib"]

[project.urls]
# The original CEDAR-sim repository does not exist (lost code, 2026-11-16).
# Do not restore these URLs until the reference implementation is published.
Documentation = "MODEL_SPEC_v2.1.md"

[tool.setuptools.packages.find]
include = ["cdata_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
